name: 임시 네이버 접속 테스트 (사용 후 삭제)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 의존성 설치
        run: npm install axios
      - name: 접속 테스트 (실제 코드와 동일한 axios.get, 5000ms 타임아웃)
        run: |
          node -e "
          const axios = require('axios');
          const urls = ['https://www.naver.com','https://www.daum.net','https://www.google.com','https://www.cloudflare.com'];
          (async () => {
            for (const url of urls) {
              const start = Date.now();
              try {
                const r = await axios.get(url, { timeout: 5000 });
                console.log(url, 'OK', r.status, (Date.now()-start)+'ms');
              } catch (err) {
                console.log(url, 'FAIL', err.response ? err.response.status : err.message, (Date.now()-start)+'ms');
              }
            }
          })();
          "
