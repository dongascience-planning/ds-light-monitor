name: 임시 네이버 접속 테스트 (사용 후 삭제)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 접속 테스트
        run: |
          for url in https://www.naver.com https://www.daum.net https://www.google.com https://www.cloudflare.com; do
            echo "=== $url ==="
            curl -s -o /dev/null -w "HTTP %{http_code} / %{time_total}초\n" --max-time 10 "$url" || echo "실패"
          done
